<a href="{{ htmlFileName }}">
  <div class="flex flex-col space-y-2 h-full border border-white/15 rounded-md">
    <div>
      <img
        class="rounded-t-md"
        src="./blog_images/{{ image }}"
        alt="Blog image"
      />
    </div>
    <div class="space-y-2 px-3 py-1">
      <p class="text-xs font-medium text-slate-400">{{ date }}</p>
      <h1 class="text-xl font-bold text-white">{{ title }}</h1>
      <p class="font-semibold text-slate-300">{{ intro }}</p>
    </div>
  </div>
</a>
