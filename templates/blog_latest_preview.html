<a href="{{ htmlFileName }}">
  <div class="flex justify-center my-6">
    <div class="flex-1 space-y-2">
      <p class="text-slate-400">{{ date }}</p>
      <h1 class="text-3xl font-bold">{{ title }}</h1>
      <p class="text-lg font-semibold text-slate-300">{{ intro }}</p>
    </div>
    <div class="flex-1">
      <img
        class="rounded-md"
        src="./blog_images/{{ image }}"
        alt="Blog image"
      />
    </div>
  </div>
</a>
